<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert between JSON and TOML formats easily">
    <meta name="theme-color" content="#ffffff">
    <title>JSON ⇄ TOML Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>JSON ⇄ TOML</h1>
            <p class="subtitle">Convert between JSON and TOML formats</p>
        </header>

        <div class="converter-section">
            <div class="controls">
                <button id="jsonToTomlBtn" class="direction-btn active" title="Convert JSON to TOML">
                    JSON → TOML
                </button>
                <button id="tomlToJsonBtn" class="direction-btn" title="Convert TOML to JSON">
                    TOML → JSON
                </button>
            </div>

            <div class="panels">
                <div class="panel input-panel">
                    <div class="panel-header">
                        <label for="inputArea" id="inputLabel">JSON Input</label>
                    </div>
                    <textarea
                        id="inputArea"
                        class="textarea"
                        placeholder="Paste your JSON here..."
                        spellcheck="false"
                    ></textarea>
                </div>

                <div class="panel output-panel">
                    <div class="panel-header">
                        <label for="outputArea" id="outputLabel">TOML Output</label>
                    </div>
                    <textarea
                        id="outputArea"
                        class="textarea"
                        placeholder="Converted output will appear here..."
                        readonly
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>

            <div class="button-group">
                <button id="copyBtn" class="action-btn" title="Copy output to clipboard">
                    📋 Copy
                </button>
                <button id="clearBtn" class="action-btn" title="Clear all inputs">
                    🗑 Clear
                </button>
                <button id="sampleBtn" class="action-btn" title="Load sample JSON">
                    📝 Sample
                </button>
            </div>
        </div>

        <footer class="app-footer">
            <p>JSON ⇄ TOML Converter • Built with care</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
