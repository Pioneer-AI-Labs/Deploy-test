<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert between JSON and TOML formats easily">
    <meta name="theme-color" content="#ffffff">
    <title>JSON ⇄ TOML Converter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <h1>JSON ⇄ TOML</h1>
            <p class="subtitle">Convert between JSON and TOML formats</p>
        </header>

        <main class="converter-section">
            <div class="controls" role="group" aria-label="Conversion direction">
                <button type="button" id="jsonToTomlBtn" class="direction-btn active"
                        title="Convert JSON to TOML" aria-pressed="true">
                    JSON → TOML
                </button>
                <button type="button" id="tomlToJsonBtn" class="direction-btn"
                        title="Convert TOML to JSON" aria-pressed="false">
                    TOML → JSON
                </button>
            </div>

            <div class="panels">
                <div class="panel input-panel">
                    <div class="panel-header">
                        <label for="inputArea" id="inputLabel">JSON Input</label>
                    </div>
                    <textarea
                        id="inputArea"
                        class="textarea"
                        placeholder="Paste your JSON here..."
                        spellcheck="false"
                    ></textarea>
                </div>

                <div class="panel output-panel">
                    <div class="panel-header">
                        <label for="outputArea" id="outputLabel">TOML Output</label>
                    </div>
                    <textarea
                        id="outputArea"
                        class="textarea"
                        placeholder="Converted output will appear here..."
                        readonly
                        spellcheck="false"
                    ></textarea>
                </div>
            </div>

            <div class="button-group">
                <button type="button" id="copyBtn" class="action-btn"
                        title="Copy output to clipboard" aria-label="Copy output to clipboard">
                    Copy
                </button>
                <button type="button" id="clearBtn" class="action-btn"
                        title="Clear all inputs" aria-label="Clear all content">
                    Clear
                </button>
                <button type="button" id="sampleBtn" class="action-btn"
                        title="Load sample JSON" aria-label="Load example data">
                    Load Example
                </button>
            </div>
        </main>

        <footer class="app-footer">
            <p>JSON ⇄ TOML Converter • Built with care</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
